name: scheduled-checks

on:
  schedule:
    # Weekly network-dependent integrity checks (Monday 05:17 UTC).
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vendored kaspa-wasm integrity against upstream release
        run: npm run check:vendor-wasm
      - name: PNN resolver reachability
        run: npm run check:pnn-browser
