name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Workspace tests
        run: npm test
      - name: Schema and vector validation
        run: npm run validate:schemas
      - name: Generated schema validator drift
        run: npm run generate:schema-validators && git diff --exit-code -- packages/core/src/generated
      - name: Checkout pinned Rusty Kaspa consensus source
        run: |
          git init --quiet "$RUNNER_TEMP/rusty-kaspa"
          git -C "$RUNNER_TEMP/rusty-kaspa" remote add origin https://github.com/kaspanet/rusty-kaspa.git
          git -C "$RUNNER_TEMP/rusty-kaspa" fetch --quiet --depth=1 origin c338d495bec29e4dc8b5149f99e8db6fa916ed4a
          git -C "$RUNNER_TEMP/rusty-kaspa" checkout --quiet --detach FETCH_HEAD
      - name: Rusty Kaspa consensus oracle and generated vector checks
        env:
          KASPA_X402_KASPA_CONSENSUS_ROOT: ${{ runner.temp }}/rusty-kaspa
        run: |
          npm run validate:tx-v1-consensus
          npm run check:exact-consensus-vector
          npm run check:exact-http-vector
          npm run check:exact-interop-vector
          npm run check:batch-interop-vector
      - name: Offline proof
        run: npm run proof:offline
      - name: Covenant fixture checks
        run: npm run check:covenant-fixtures
      - name: Site build
        run: npm run site:build
      - name: Site checks
        run: npm run site:check
      - name: Gateway Worker dry-run build
        run: npm --workspace @kaspa-x402/demo-gateway run build
      - name: Generated Worker binding drift
        run: npm run check:worker-types
      - name: Admin CLI secret and transport checks
        run: npm run check:admin-security
      - name: Hosted proof offer-pin checks
        run: npm run check:hosted-offer-pins
      - name: Public package pack dry-run
        run: npm run pack:public:dry-run
      - name: Whitespace and diff checks
        run: npm run check:diff
