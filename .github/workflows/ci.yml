name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-release-artifacts:
    needs: [verify, windows, covenant-reproduction]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: covenant-compiler-linux
          path: release-artifacts/compiler
      - name: Extract independently reproduced compiler receipt
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release-artifacts/compiler/covenant-compiler.json")); const c=r.cases.find(c=>c.name==="real pinned compiler reproduces both covenants"); if(r.failed || !c?.passed)throw new Error("compiler proof failed"); fs.writeFileSync("release-artifacts/compiler-proof.json",c.evidence.output);'
      - name: Build and inspect exact SDK release archives
        run: |
          node protocol/scripts/prepare-sdk-release.mjs --revision "$GITHUB_SHA" --out release-artifacts/sdk --compiler-proof release-artifacts/compiler-proof.json
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; import {verifyBundle} from "./protocol/scripts/sdk-release-artifacts.mjs"; const digest=crypto.createHash("sha256").update(fs.readFileSync("release-artifacts/sdk/manifest.json")).digest("hex"); verifyBundle("release-artifacts/sdk",process.env.GITHUB_SHA,digest,true); console.log(JSON.stringify({revision:process.env.GITHUB_SHA,manifestSha256:digest})); fs.writeFileSync("release-artifacts/sdk-approval.json",JSON.stringify({revision:process.env.GITHUB_SHA,manifestSha256:digest})+"\n");'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-release-bundle
          path: release-artifacts/sdk/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-release-approval
          path: release-artifacts/sdk-approval.json
          if-no-files-found: error
  covenant-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kaspanet/silverscript
          ref: 3ed973335b59269293564805cc2c58a14595ec03
          path: .silverscript
          persist-credentials: false
      - name: Install compiler native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev cmake pkg-config
      - name: Install pinned compiler toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - run: npm ci
      - run: npm --workspace @kaspa-x402/covenant run build
      - name: Adversarial CLI proof and actual covenant reproduction
        env:
          SILVERSCRIPT_DIR: ${{ github.workspace }}/.silverscript
        run: node protocol/scripts/proof-covenant-compiler-e2e.mjs --out proof-artifacts/covenant-compiler.json --real
      - name: Retain compiler proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: covenant-compiler-linux
          path: proof-artifacts/covenant-compiler.json
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - name: Use Windows checkout line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Workspace tests
        run: npm test
      - name: Issuer storage E2E proof
        run: node protocol/scripts/proof-hash-chain-issuer-storage-e2e.mjs --out proof-artifacts/issuer-storage.json
      - name: Retain issuer storage proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issuer-storage-windows
          path: proof-artifacts/issuer-storage.json
          if-no-files-found: error
      - name: Offline proofs
        run: node protocol/scripts/proof-offline.mjs --out proof-artifacts/offline.json
      - name: Retain offline proof report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-proof-windows
          path: protocol/proof-artifacts/offline.json
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Standalone protocol verification
        run: npm run check:protocol-isolation
      - name: Independent host builds
        run: npm run check:host-isolation
      - name: Workspace tests
        run: npm test
      - name: Issuer storage E2E proof
        run: node protocol/scripts/proof-hash-chain-issuer-storage-e2e.mjs --out proof-artifacts/issuer-storage.json
      - name: Retain issuer storage proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issuer-storage-linux
          path: proof-artifacts/issuer-storage.json
          if-no-files-found: error
      - name: Offline proofs
        run: node protocol/scripts/proof-offline.mjs --out proof-artifacts/offline.json
      - name: Retain offline proof report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-proof-linux
          path: protocol/proof-artifacts/offline.json
          if-no-files-found: error
      - name: Schema validation
        run: npm run validate:schemas
      - name: Generated schema validator drift
        run: npm run generate:schema-validators && git diff --exit-code -- protocol/packages/core/src/generated
      - name: Site build
        run: npm run site:build
      - name: Site checks
        run: npm run site:check
      - name: Hash-chain demo flow
        run: npm run check:hash-chain-demo
      - name: Whitespace and diff checks
        run: npm run check:diff
      - name: Check out pinned Kaspa consensus source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kaspanet/rusty-kaspa
          ref: 01b532e8b553523216471682649693af92f0fd16
          path: .kaspa-consensus
          persist-credentials: false
      - name: Install consensus harness native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev cmake pkg-config
      - name: Install consensus harness Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Validate transaction vectors against Kaspa consensus
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          CARGO_BUILD_JOBS: 2
          KASPA_X402_CONSENSUS_CARGO_HOME: ${{ runner.temp }}/kaspa-x402-consensus-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/kaspa-x402-consensus-target
        run: |
          set -o pipefail
          mkdir -p proof-artifacts
          node protocol/scripts/validate-tx-v1-consensus.mjs --kaspa-root .kaspa-consensus 2> >(tee proof-artifacts/tx-v1-consensus.stderr.log >&2) | tee proof-artifacts/tx-v1-consensus.json
      - name: Retain consensus proof report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tx-v1-consensus-linux
          path: |
            proof-artifacts/tx-v1-consensus.json
            proof-artifacts/tx-v1-consensus.stderr.log
          if-no-files-found: warn
